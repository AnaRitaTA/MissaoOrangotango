<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="rt rd" font-family="Arial, Helvetica, sans-serif">
  <title id="rt">Rótulo de uma tablete de chocolate de leite recheado</title>
  <desc id="rd">Verso da embalagem com a lista de ingredientes, alergénios, informação nutricional, peso e validade. Ingredientes: açúcar, gordura vegetal (palma), manteiga de cacau, leite em pó inteiro, pasta de cacau, soro de leite em pó, gordura vegetal (palmiste), emulsionante: lecitina de soja, aromatizante.</desc>
  <defs>
    <pattern id="crimp" width="10" height="16" patternUnits="userSpaceOnUse">
      <rect width="10" height="16" fill="#5a2e14"/><path d="M0 0 L5 16 L10 0" fill="none" stroke="#7a4424" stroke-width="2"/>
    </pattern>
    <linearGradient id="wrap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b3517"/><stop offset="1" stop-color="#4a230f"/>
    </linearGradient>
  </defs>
  <!-- embalagem -->
  <rect x="0" y="0" width="640" height="470" rx="10" fill="url(#wrap)"/>
  <rect x="0" y="0" width="640" height="16" fill="url(#crimp)"/>
  <rect x="0" y="454" width="640" height="16" fill="url(#crimp)"/>
  <!-- faixa de marca -->
  <text x="26" y="50" fill="#f5d9a8" font-size="22" font-weight="700" font-family="Georgia, serif" font-style="italic">Selva Doce</text>
  <text x="26" y="70" fill="#e8c38c" font-size="12" letter-spacing="1.5">CHOCOLATE DE LEITE RECHEADO COM CREME DE AVELÃ</text>
  <g transform="translate(560 44)">
    <path d="M0 -20 C-14 -4 -18 6 -18 12 A18 18 0 0 0 18 12 C18 6 14 -4 0 -20Z" fill="#e8a25a"/>
    <path d="M-1 -6 h2 v26 h-2z" fill="#4a230f"/>
  </g>
  <!-- painel branco -->
  <rect x="20" y="86" width="600" height="352" rx="6" fill="#fffdf6"/>
  <!-- ingredientes -->
  <text x="38" y="114" fill="#1a1a1a" font-size="15" font-weight="700">INGREDIENTES:</text>
  <text fill="#1a1a1a" font-size="14">
    <tspan x="38" y="136">açúcar, gordura vegetal (palma), manteiga de cacau, <tspan font-weight="700">leite</tspan> em pó</tspan>
    <tspan x="38" y="156">inteiro, pasta de cacau, <tspan font-weight="700">avelãs</tspan> (5%), soro de <tspan font-weight="700">leite</tspan> em pó,</tspan>
    <tspan x="38" y="176">gordura vegetal (palmiste), emulsionante: lecitina de <tspan font-weight="700">soja</tspan>,</tspan>
    <tspan x="38" y="196">aromatizante. Cacau: 30% mínimo no chocolate de leite.</tspan>
  </text>
  <text x="38" y="222" fill="#444" font-size="12.5">Pode conter vestígios de outros frutos de casca rija e de trigo.</text>
  <text x="38" y="240" fill="#444" font-size="12.5">Conservar em local fresco e seco.</text>
  <!-- tabela nutricional -->
  <g transform="translate(38 258)" font-size="12.5" fill="#1a1a1a">
    <rect x="0" y="0" width="330" height="164" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="0" y="0" width="330" height="22" fill="#1a1a1a"/>
    <text x="8" y="15" fill="#fff" font-weight="700">Informação nutricional</text>
    <text x="322" y="15" fill="#fff" font-weight="700" text-anchor="end">por 100 g</text>
    <g>
      <text x="8" y="40">Energia</text><text x="322" y="40" text-anchor="end">2268 kJ / 543 kcal</text>
      <line x1="0" y1="46" x2="330" y2="46" stroke="#bbb"/>
      <text x="8" y="62">Lípidos</text><text x="322" y="62" text-anchor="end">32 g</text>
      <text x="20" y="78" fill="#444">dos quais saturados</text><text x="322" y="78" text-anchor="end">19 g</text>
      <line x1="0" y1="84" x2="330" y2="84" stroke="#bbb"/>
      <text x="8" y="100">Hidratos de carbono</text><text x="322" y="100" text-anchor="end">56 g</text>
      <text x="20" y="116" fill="#444">dos quais açúcares</text><text x="322" y="116" text-anchor="end">54 g</text>
      <line x1="0" y1="122" x2="330" y2="122" stroke="#bbb"/>
      <text x="8" y="138">Proteínas</text><text x="322" y="138" text-anchor="end">6,5 g</text>
      <text x="8" y="156">Sal</text><text x="322" y="156" text-anchor="end">0,21 g</text>
    </g>
  </g>
  <!-- peso, validade, código -->
  <g transform="translate(394 258)" fill="#1a1a1a">
    <text x="0" y="16" font-size="30" font-weight="700">100 g ℮</text>
    <text x="0" y="46" font-size="12.5">Consumir de preferência antes de:</text>
    <text x="0" y="64" font-size="12.5" font-weight="700">09/2027  ·  Lote L2641</text>
    <text x="0" y="90" font-size="11.5" fill="#444">Produzido na UE para</text>
    <text x="0" y="106" font-size="11.5" fill="#444">Selva Doce, Lda. (marca fictícia)</text>
    <g transform="translate(0 122)">
      <rect width="190" height="40" fill="#fff"/>
      <g fill="#1a1a1a">
        <rect x="4" y="2" width="2" height="30"/><rect x="8" y="2" width="1" height="30"/><rect x="12" y="2" width="3" height="30"/><rect x="17" y="2" width="1" height="30"/><rect x="21" y="2" width="2" height="30"/><rect x="26" y="2" width="1" height="30"/><rect x="29" y="2" width="3" height="30"/><rect x="34" y="2" width="1" height="30"/><rect x="38" y="2" width="2" height="30"/><rect x="43" y="2" width="1" height="30"/><rect x="46" y="2" width="2" height="30"/><rect x="51" y="2" width="3" height="30"/><rect x="56" y="2" width="1" height="30"/><rect x="60" y="2" width="2" height="30"/><rect x="65" y="2" width="1" height="30"/><rect x="68" y="2" width="3" height="30"/><rect x="74" y="2" width="1" height="30"/><rect x="78" y="2" width="2" height="30"/><rect x="83" y="2" width="1" height="30"/><rect x="86" y="2" width="2" height="30"/><rect x="91" y="2" width="3" height="30"/><rect x="96" y="2" width="1" height="30"/><rect x="100" y="2" width="2" height="30"/><rect x="105" y="2" width="1" height="30"/><rect x="108" y="2" width="3" height="30"/><rect x="114" y="2" width="1" height="30"/><rect x="118" y="2" width="2" height="30"/><rect x="123" y="2" width="1" height="30"/><rect x="126" y="2" width="3" height="30"/><rect x="131" y="2" width="1" height="30"/><rect x="135" y="2" width="2" height="30"/><rect x="140" y="2" width="1" height="30"/><rect x="143" y="2" width="3" height="30"/><rect x="149" y="2" width="1" height="30"/><rect x="153" y="2" width="2" height="30"/><rect x="158" y="2" width="1" height="30"/><rect x="161" y="2" width="3" height="30"/><rect x="167" y="2" width="1" height="30"/><rect x="171" y="2" width="2" height="30"/><rect x="176" y="2" width="1" height="30"/><rect x="180" y="2" width="3" height="30"/>
      </g>
      <text x="95" y="39" font-size="8" text-anchor="middle" fill="#1a1a1a">0 000000 000000</text>
    </g>
  </g>
</svg>
