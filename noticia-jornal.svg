<text font-size="38" font-weight="700" fill="#1d1a15"><tspan x="36" y="160">Os teus doces de Halloween podem</tspan><tspan x="36" y="204">estar a matar orangotangos</tspan></text>
<text font-size="17" font-style="italic" fill="#4a4336"><tspan x="36" y="236">Conservacionistas pedem atenção aos doces que escolhemos. Mas o que tem uma coisa a ver com a outra?</tspan></text>
