<text x="36" y="580" font-size="12" font-style="italic" fill="#4a4336">Orangotango numa floresta tropical do Bornéu. Ilustração.</text>
<text x="600" y="272" font-size="14.5" fill="#1d1a15"><tspan x="600" dy="0">No Halloween compram-se doces</tspan><tspan x="600" dy="21">como em nenhuma outra época do</tspan><tspan x="600" dy="21">ano. Mas, segundo jardins</tspan><tspan x="600" dy="21">zoológicos e organizações de</tspan><tspan x="600" dy="21">conservação da natureza, a</tspan><tspan x="600" dy="21">escolha desses doces pode ter</tspan><tspan x="600" dy="21">consequências a milhares de</tspan><tspan x="600" dy="21">quilómetros de distância: nas</tspan><tspan x="600" dy="21">florestas onde vivem os</tspan><tspan x="600" dy="21">orangotangos.</tspan></text><text x="600" y="492" font-size="14.5" fill="#1d1a15"><tspan x="600" dy="0">Continua na página 14 ▸</tspan></text>
