<title id="nt">Notícia de jornal: Os teus doces de Halloween podem estar a matar orangotangos</title>
<desc id="nd">Notícia adaptada e traduzida para fins didáticos a partir de um artigo do HuffPost (18 de outubro de 2016). Inclui ilustração de floresta tropical ao lado de uma plantação de palmeira-dendém, com um orangotango numa árvore.</desc>
