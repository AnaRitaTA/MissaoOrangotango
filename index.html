<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missão Orangotango · Escape room</title>
<meta name="description" content="Escape room digital: de que forma a compra de doces pode afetar as populações de orangotangos no seu habitat natural?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4efe4; --panel:#fffdf8; --ink:#1f2a22; --muted:#5d6a60; --line:#dcd3c0;
  --green:#1f4d36; --green-2:#2f6b4c; --leaf:#e3eee4; --orange:#c8601e; --orange-2:#f3dcc8;
  --ok:#2f7d4f; --ok-bg:#e2f2e7; --bad:#b3401f; --bad-bg:#f8e3dc; --paper:#fbf7ec;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(31,42,34,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141a16; --panel:#1c241f; --ink:#e9eee8; --muted:#a4b0a7; --line:#33403a;
    --green:#8fd0a8; --green-2:#6fb68d; --leaf:#22302a; --orange:#f09a5c; --orange-2:#3a2a1f;
    --ok:#7fd29d; --ok-bg:#1f3527; --bad:#f0977a; --bad-bg:#3a241e; --paper:#221f18;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#141a16; --panel:#1c241f; --ink:#e9eee8; --muted:#a4b0a7; --line:#33403a;
  --green:#8fd0a8; --green-2:#6fb68d; --leaf:#22302a; --orange:#f09a5c; --orange-2:#3a2a1f;
  --ok:#7fd29d; --ok-bg:#1f3527; --bad:#f0977a; --bad-bg:#3a241e; --paper:#221f18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-size:17px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--green);color:#fff}
:root[data-theme="dark"] header.top{background:#10271b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top{background:#10271b}}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.brand{font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.locks{display:flex;gap:6px;margin-left:auto}
.lock{width:30px;height:34px;border-radius:7px;display:grid;place-items:center;font-weight:800;background:rgba(255,255,255,.14);color:rgba(255,255,255,.55);font-size:15px}
.lock.open{background:#f3a661;color:#2a1405}
.meta{display:flex;gap:10px;align-items:center;font-size:14px;opacity:.95}
.timer{font-variant-numeric:tabular-nums;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:999px}
.iconbtn{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:3px 10px;font:inherit;font-size:13px;cursor:pointer}
main{padding:24px 0 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:24px;margin-bottom:18px}
.kicker{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--orange)}
h1,h2,h3{line-height:1.2;margin:.2em 0 .5em}
h1{font-size:clamp(26px,5vw,36px);color:var(--green)}
h2{font-size:clamp(22px,4vw,28px);color:var(--green)}
h3{font-size:19px}
p{margin:.5em 0 .9em}
.muted{color:var(--muted)}
.mission{background:var(--leaf);border-radius:14px;padding:16px 18px;font-weight:700;font-size:19px;color:var(--green);border:1px dashed var(--green-2)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:#fff;border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:800;cursor:pointer;min-height:46px}
.btn:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--green);border:2px solid var(--green)}
.btn.small{padding:8px 14px;min-height:38px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,select:focus,.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
label{font-weight:700;display:block;margin:.6em 0 .3em}
.feedback{margin-top:14px;padding:12px 14px;border-radius:10px;display:none}
.feedback.ok{display:block;background:var(--ok-bg);color:var(--ok);font-weight:700}
.feedback.bad{display:block;background:var(--bad-bg);color:var(--bad);font-weight:700}
.hint{margin-top:10px;display:none;background:var(--orange-2);border-radius:10px;padding:10px 14px}
.hint.show{display:block}
.letter{display:inline-grid;place-items:center;width:44px;height:50px;border-radius:10px;background:#f3a661;color:#2a1405;font-weight:800;font-size:24px;margin:0 4px;vertical-align:middle}
/* clipping */
.clip{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:22px 24px;font-family:"Libre Baskerville",Georgia,serif;transform:rotate(-.6deg);box-shadow:var(--shadow);position:relative}
.clip .mast{display:flex;justify-content:space-between;border-bottom:3px double var(--ink);padding-bottom:6px;margin-bottom:12px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.clip h2{font-family:"Libre Baskerville",Georgia,serif;color:var(--ink);font-size:clamp(21px,4vw,28px);margin:.2em 0 .35em}
.clip .dek{font-style:italic;color:var(--muted);margin-bottom:12px}
.clip .cols{columns:2 240px;column-gap:24px;font-size:15px;line-height:1.6}
.clip .cols p{margin:0 0 .7em}
.clip .src{font-family:"Nunito",sans-serif;font-size:12px;color:var(--muted);margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.clip img{max-width:100%;display:block;margin:0 auto}
.tag{display:inline-block;font-family:"Nunito",sans-serif;font-size:12px;font-weight:800;background:var(--orange-2);color:var(--orange);padding:2px 8px;border-radius:999px}
/* matching */
.match{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:10px 14px;align-items:center}
.match .term{font-weight:800;color:var(--green)}
@media (max-width:560px){.match{grid-template-columns:1fr}.match .term{margin-top:8px}}
/* label */
.label-box{border:2px solid var(--ink);border-radius:6px;padding:14px 16px;background:var(--paper);max-width:560px}
.label-box .ttl{font-weight:800;border-bottom:6px solid var(--ink);padding-bottom:4px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
/* order */
.order{list-style:none;padding:0;margin:0;counter-reset:n}
.order li{display:flex;align-items:center;gap:10px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.order li::before{counter-increment:n;content:counter(n);flex:none;width:28px;height:28px;border-radius:50%;background:var(--green);color:var(--panel);display:grid;place-items:center;font-weight:800;font-size:14px}
.order li span{flex:1}
.order button{flex:none;width:36px;height:36px;border-radius:9px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-size:16px}
/* options */
.opts{display:grid;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--bg)}
.opt{font-weight:400}
.opt input{margin-top:5px;accent-color:var(--orange)}
.data{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:10px 0 16px}
.stat{background:var(--leaf);border-radius:12px;padding:14px}
.stat .big{display:block;font-size:24px;font-weight:800;color:var(--green);line-height:1.15;margin-bottom:6px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.bank span{border-radius:999px;padding:4px 10px;background:var(--bg);border:1.5px solid var(--line);font-size:14px}
.bank span.used{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:800}
.extra{border-left:4px solid var(--orange);padding:4px 0 4px 14px;margin-top:18px}
.teacher{background:#fff4d6;color:#3b2c05;border:1px solid #e6c96b;border-radius:12px;padding:14px 16px;margin-top:16px;display:none;font-size:15px}
.teacher.on{display:block}
.teacher b{color:#6b4a00}
.hidden{display:none!important}
footer{font-size:13px;color:var(--muted);text-align:center;padding:20px 16px 40px}
.cert{text-align:center;border:3px double var(--green);border-radius:16px;padding:26px}
@media print{header.top,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path fill="#f3a661" d="M12 2c-3 3.5-7 5.5-7 11a7 7 0 0 0 14 0c0-5.5-4-7.5-7-11Z"/><path fill="#1f4d36" d="M11.3 8h1.4v12h-1.4z"/></svg>
      Missão Orangotango
    </div>
    <div class="meta"><span id="teamLabel"></span><span class="timer" id="timer" aria-label="Tempo">00:00</span></div>
    <div class="locks" id="locks" aria-label="Letras descobertas"></div>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="Mudar tema">◐</button>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer>
  Escape room didática · Didática da Biologia e da Geologia · Notícia adaptada de HuffPost (18/10/2016) · Dados da sala 5: Voigt et al. (2018), <i>Current Biology</i>, 28(5), 761–769.
  <br><a href="#" id="resetLink" class="noprint">Recomeçar a missão</a>
</footer>

<script>
/* ============================================================
   CONFIGURAÇÃO
   Para usar a imagem real de uma notícia: coloque o ficheiro na
   mesma pasta (por exemplo, noticia.jpg) e escreva o nome abaixo.
   Se ficar vazio, aparece a notícia construída para a atividade.
   ============================================================ */
const IMAGEM_NOTICIA = "";          // ex.: "noticia.jpg"
const MINUTOS = 45;                  // duração sugerida (só informativa)
const PALAVRA_FINAL = "BORNEU";

/* ---------- estado ---------- */
const TEACHER = new URLSearchParams(location.search).has("professor");
const KEY = "missao-orangotango-v1";
let S = { step: 0, team: "", start: null, letters: [], hints: 0, answers: {} };
try { const saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (saved) S = Object.assign(S, saved); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- utilitários ---------- */
const $ = (s, el = document) => el.querySelector(s);
const norm = s => (s || "").toString().normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
function el(html){ const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function shuffle(a){ const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function feedback(box, ok, msg){ box.className = "feedback " + (ok ? "ok" : "bad"); box.innerHTML = msg; }

/* ---------- tema ---------- */
$("#themeBtn").onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};

/* ---------- cabeçalho ---------- */
function renderLocks(){
  const box = $("#locks"); box.innerHTML = "";
  PALAVRA_FINAL.split("").forEach((ch, i) => {
    const got = S.letters[i];
    box.appendChild(el(`<div class="lock ${got ? "open" : ""}" title="Sala ${i + 1}">${got ? ch : "🔒"}</div>`));
  });
  $("#teamLabel").textContent = S.team ? "Equipa: " + S.team : "";
}
setInterval(() => {
  if (!S.start) return;
  const s = Math.floor(((S.end || Date.now()) - S.start) / 1000);
  $("#timer").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}, 1000);

/* ---------- salas ---------- */
const ROOMS = [];

/* Ecrã inicial: a notícia */
function intro(){
  const img = IMAGEM_NOTICIA
    ? `<div class="clip"><img src="${IMAGEM_NOTICIA}" alt="Notícia de jornal sobre os orangotangos do Bornéu"></div>`
    : `<figure style="margin:0">${NOTICIA_SVG}<figcaption class="muted" style="font-size:13px;margin-top:6px">Notícia adaptada e traduzida para esta atividade. O resto da notícia fica guardado até ao fim da missão. <a href="noticia-jornal.svg" target="_blank" rel="noopener">Ver em tamanho grande</a></figcaption></figure>`;
  const node = el(`<section>
    <div class="card">
      <div class="kicker">Escape room · Ciências Naturais e Biologia</div>
      <h1>Missão Orangotango</h1>
      <p>Um jornal publicou esta notícia. A vossa equipa tem de investigar o caso, sala a sala. Em cada sala resolvem um desafio e descobrem uma <b>letra</b>. Com as seis letras, abrem o cadeado final.</p>
      ${img}
      <p style="margin-top:22px"><b>A pergunta da missão:</b></p>
      <div class="mission">De que forma a compra de doces pode afetar as populações de orangotangos no seu habitat natural?</div>
      <label for="team">Nome da equipa</label>
      <input type="text" id="team" maxlength="40" placeholder="Ex.: Os Investigadores da Floresta" value="${S.team || ""}">
      <p class="muted" style="font-size:14px">Tempo sugerido: ${MINUTOS} minutos. Podem pedir pistas, mas ficam registadas.</p>
      <button class="btn" id="go">Começar a investigação →</button>
      ${teacherBox("Antes de começar", "Projetar a notícia e ler a pergunta da missão em voz alta. Não explicar nada: a sala 1 serve para recolher as ideias prévias. Guardar o título (\"podem estar a matar orangotangos\") para a sala 6: é um título verdadeiro, falso ou sensacionalista? Para ver este painel, abra o site com <code>?professor</code> no fim do endereço.")}
    </div></section>`);
  $("#go", node).onclick = () => {
    const t = $("#team", node).value.trim();
    if (!t) { $("#team", node).focus(); return; }
    S.team = t; S.start = S.start || Date.now(); S.step = 1; save(); render();
  };
  return node;
}

/* Sala 1 — hipótese */
ROOMS.push(() => {
  const node = roomShell(1, "O que achas?", "Antes de investigar, registem as vossas ideias. Não há respostas certas nem erradas nesta sala.", `
    <label for="h1">Que relação achas que existe entre os orangotangos e os doces que compramos?</label>
    <textarea id="h1" placeholder="Escrevam a vossa hipótese...">${S.answers.hipotese || ""}</textarea>
    <label for="conf">Quão confiantes estão na vossa hipótese? <span id="confv">${S.answers.confianca || 3}</span>/5</label>
    <input type="range" id="conf" min="1" max="5" value="${S.answers.confianca || 3}" style="width:100%;accent-color:var(--orange)">
    <label for="q1">Que pergunta gostariam de ver respondida no fim desta missão?</label>
    <input type="text" id="q1" value="${S.answers.pergunta || ""}" placeholder="Ex.: Porque é que...">
  `, "Pensem no caminho que um doce faz até chegar à loja: de que é feito? De onde vêm os ingredientes?",
  "Abrir diferenças (Ogborn): o objetivo é que os alunos se comprometam com uma hipótese antes da teoria. Guardar as respostas para o fim — a última sala pede-lhes que comparem. Pergunta para o plenário: <b>\"Quem acha que não há relação nenhuma? Porquê?\"</b>");
  $("#conf", node).oninput = e => $("#confv", node).textContent = e.target.value;
  check(node, 1, () => {
    const h = $("#h1", node).value.trim();
    S.answers.hipotese = h; S.answers.confianca = $("#conf", node).value; S.answers.pergunta = $("#q1", node).value.trim();
    if (h.split(/\s+/).filter(Boolean).length < 8) return [false, "Escrevam pelo menos uma frase completa (8 palavras ou mais) a explicar a vossa hipótese."];
    return [true, "Hipótese registada! Vão voltar a ela no fim da missão."];
  });
  return node;
});

/* Sala 2 — palavras e significados */
const TERMS = [
  ["População", "Conjunto de indivíduos da mesma espécie que vivem na mesma área, ao mesmo tempo."],
  ["Habitat", "Local onde um ser vivo encontra as condições de que precisa para viver: alimento, abrigo, reprodução."],
  ["Desflorestação", "Processo de destruição de floresta, por abate de árvores, para usar o terreno de outra forma."],
  ["Monocultura", "Cultivo de uma só espécie de planta numa grande área."],
  ["Criticamente em perigo", "Categoria de ameaça de uma espécie com risco extremamente elevado de extinção na natureza."],
];
ROOMS.push(() => {
  const defs = shuffle(TERMS.map(t => t[1]));
  const rows = TERMS.map((t, i) => `<div class="term">${t[0]}</div>
    <select id="m${i}" aria-label="Significado de ${t[0]}"><option value="">— escolham o significado —</option>${defs.map(d => `<option>${d}</option>`).join("")}</select>`).join("");
  const node = roomShell(2, "Palavras com dois sentidos", "Na notícia aparecem palavras que usamos no dia a dia, mas que em ciência têm um significado preciso. Liguem cada palavra ao seu significado científico.", `
    <div class="match">${rows}</div>
    <div class="extra">
      <label for="pop">Na frase <i>"A população de Lisboa gosta de doces"</i> e na frase <i>"A população de orangotangos diminuiu"</i>, a palavra <b>população</b> significa o mesmo? Expliquem a diferença.</label>
      <textarea id="pop" style="min-height:80px">${S.answers.populacao || ""}</textarea>
    </div>
  `, "\"Desflorestação\" vem do verbo \"desflorestar\": é um processo transformado em nome. E uma espécie \"criticamente em perigo\" é a categoria de ameaça mais grave antes de se extinguir na natureza.",
  "Linguagem científica: significados conceptuais específicos e nominalizações (desflorestar → desflorestação). A pergunta sobre <b>população</b> mostra a diferença entre o uso quotidiano (pessoas de uma cidade) e o científico (indivíduos da mesma espécie, na mesma área e no mesmo tempo). No secundário, perguntar: <b>\"Que processo está escondido em 'desflorestação'? Quem desfloresta?\"</b>");
  check(node, 2, () => {
    S.answers.populacao = $("#pop", node).value.trim();
    let right = 0;
    TERMS.forEach((t, i) => { if ($("#m" + i, node).value === t[1]) right++; });
    if (right < TERMS.length) return [false, `Têm ${right} de ${TERMS.length} ligações certas. Revejam as restantes.`];
    if (S.answers.populacao.split(/\s+/).filter(Boolean).length < 6) return [false, "As ligações estão certas! Falta responder à pergunta sobre a palavra \"população\"."];
    return [true, "Todas as palavras certas!"];
  });
  return node;
});

/* Sala 3 — decifrar o rótulo */
const INGR = [
  ["açúcar", false], ["gordura vegetal (palma)", true], ["manteiga de cacau", false], ["leite em pó inteiro", false],
  ["pasta de cacau", false], ["avelãs", false], ["soro de leite em pó", false], ["gordura vegetal (palmiste)", true],
  ["lecitina de soja", false], ["aromatizante", false],
];
const NOTICIA_SVG = `<svg xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block" viewBox="0 0 900 616" role="img" aria-labelledby="nt nd" font-family="Georgia, 'Times New Roman', serif">
<title id="nt">Notícia de jornal: Os teus doces de Halloween podem estar a matar orangotangos</title>
<desc id="nd">Notícia adaptada e traduzida para fins didáticos a partir de um artigo do HuffPost (18 de outubro de 2016). Inclui ilustração de floresta tropical ao lado de uma plantação de palmeira-dendém, com um orangotango numa árvore.</desc>
<defs>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.25  0 0 0 .07 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
<clipPath id="ph"><rect x="36" y="262" width="540" height="300"/></clipPath>

    </div>
  `, "\"Gordura vegetal\" sozinha não diz de que planta vem: olhem para o que está entre parênteses. O fruto da palmeira-dendém dá dois óleos, um da polpa (<b>palma</b>) e outro da semente (<b>palmiste</b>). E a manteiga de cacau vem de outra planta: o cacaueiro.",
  "Na União Europeia, desde dezembro de 2014, a origem dos óleos vegetais tem de estar indicada no rótulo, por isso o óleo de palma aparece com esse nome. Também pode surgir como <i>gordura de palma</i>, <i>óleo de palmiste</i>, <i>estearina</i> ou <i>oleína de palma</i>. A \"manteiga de cacau\" é uma boa armadilha: também é uma gordura vegetal, mas vem do cacaueiro. Pergunta para o plenário: <b>\"Porque é que a lei obriga a escrever a planta entre parênteses?\"</b> O óleo de palma é usado por ser barato, semissólido à temperatura ambiente, sem sabor e por aumentar o prazo de validade. Ponte: <b>entidades</b> — o aluno passa de \"doce\" para \"ingrediente\" e para \"planta cultivada num sítio concreto\".");
  node.querySelectorAll(".chip").forEach(c => c.onclick = () => c.setAttribute("aria-pressed", c.getAttribute("aria-pressed") === "true" ? "false" : "true"));
  check(node, 3, () => {
    S.answers.porque = $("#porque", node).value.trim();
    const sel = [...node.querySelectorAll(".chip")].filter(c => c.getAttribute("aria-pressed") === "true").map(c => +c.dataset.i);
    const good = INGR.map((g, i) => g[1] ? i : -1).filter(i => i >= 0);
    const ok = sel.length === good.length && good.every(i => sel.includes(i));
    if (!ok) return [false, sel.length > good.length ? "Selecionaram ingredientes a mais." : "Ainda falta encontrar pelo menos um ingrediente."];
    return [true, "Encontraram os dois ingredientes da palmeira-dendém!"];
  });
  return node;
});

/* Sala 4 — ordenar a cadeia */
const CHAIN = [
  "Compramos muitos chocolates e outros doces que contêm óleo de palma.",
  "Aumenta a procura de óleo de palma no mercado mundial.",
  "Abatem-se florestas tropicais para plantar palmeiras-dendém em monocultura.",
  "Os orangotangos perdem habitat: menos alimento, menos abrigo e grupos isolados uns dos outros.",
  "A população de orangotangos diminui.",
];
ROOMS.push(() => {
  let order = S.answers.ordem;
  if (!order) { order = shuffle(CHAIN.map((_, i) => i)); if (order.every((v, i) => v === i)) order = [2, 0, 4, 1, 3]; }
  const node = roomShell(4, "Liguem as pistas", "Estas cinco pistas contam uma história, mas estão baralhadas. Usem as setas para as pôr pela ordem de causa e efeito.", `
    <ol class="order" id="ord"></ol>
    <div class="extra">
      <label for="con">Que palavra liga melhor as duas partes? <i>"A floresta é abatida; ______ os orangotangos ficam sem alimento e sem abrigo."</i></label>
      <select id="con"><option value="">— escolham —</option><option>por isso</option><option>embora</option><option>apesar de</option><option>ou seja, nunca</option></select>
    </div>
  `, "Comecem pelo que nós fazemos (no supermercado) e acabem no que acontece à espécie (na floresta).",
  "Explicar é contar uma história com <b>entidades</b> e <b>relações</b> (Ogborn et al.). Aqui os alunos constroem a cadeia causal. A pergunta do conector trabalha a linguagem que relaciona. Ponte para a sala 5: <b>\"Esta cadeia está completa? Será a única causa?\"</b>");
  const ol = $("#ord", node);
  function draw(){
    ol.innerHTML = "";
    order.forEach((idx, pos) => {
      const li = el(`<li><span>${CHAIN[idx]}</span>
        <button type="button" aria-label="Subir">↑</button><button type="button" aria-label="Descer">↓</button></li>`);
      const [up, down] = li.querySelectorAll("button");
      up.disabled = pos === 0; down.disabled = pos === order.length - 1;
      up.onclick = () => { [order[pos - 1], order[pos]] = [order[pos], order[pos - 1]]; S.answers.ordem = order; save(); draw(); };
      down.onclick = () => { [order[pos + 1], order[pos]] = [order[pos], order[pos + 1]]; S.answers.ordem = order; save(); draw(); };
      ol.appendChild(li);
    });
  }
  draw();
  check(node, 4, () => {
    const okOrder = order.every((v, i) => v === i);
    const okCon = $("#con", node).value === "por isso";
    if (!okOrder) return [false, "A ordem ainda não está certa. Perguntem-se: o que tem de acontecer primeiro para o passo seguinte acontecer?"];
    if (!okCon) return [false, "A ordem está certa! Falta escolher a palavra que liga causa e consequência."];
    return [true, "A cadeia está completa!"];
  });
  return node;
});

/* Sala 5 — o que dizem os dados */
ROOMS.push(() => {
  const node = roomShell(5, "O que dizem os dados?", "Os investigadores que estudaram os orangotangos do Bornéu entre 1999 e 2015 chegaram a estes resultados.", `
    <div class="data">
      <div class="stat"><span class="big">≈ 148 500</span>orangotangos a menos no Bornéu entre 1999 e 2015: a população diminuiu para cerca de metade.</div>
      <div class="stat"><span class="big">Onde desapareceram mais?</span>O maior <i>número</i> de orangotangos desapareceu em zonas que <b>continuaram com floresta</b>.</div>
      <div class="stat"><span class="big">Onde foi mais grave?</span>A <i>densidade</i> de orangotangos diminuiu mais nas zonas <b>desflorestadas</b> ou transformadas em agricultura industrial.</div>
    </div>
    <p class="muted" style="font-size:14px">Fonte: Voigt et al. (2018), <i>Current Biology</i>, 28(5), 761–769.</p>
    <p><b>O que podemos concluir?</b></p>
    <div class="opts" id="opts5">
      ${[["a","O óleo de palma é a única causa do desaparecimento dos orangotangos."],
         ["b","Há várias causas: a perda de habitat é importante, mas os orangotangos também desaparecem em zonas com floresta, por exemplo por caça ou conflito com pessoas."],
         ["c","Os orangotangos só desaparecem onde há plantações de palmeira."],
         ["d","Os dados mostram que a floresta não tem importância para os orangotangos."]]
        .map(o => `<label class="opt"><input type="radio" name="o5" value="${o[0]}"><span>${o[1]}</span></label>`).join("")}
    </div>
    <div class="extra">
      <label for="cadeia">Voltem à cadeia da sala 4. O que lhe acrescentariam agora?</label>
      <textarea id="cadeia" style="min-height:80px">${S.answers.cadeia || ""}</textarea>
    </div>
  `, "Comparem a segunda e a terceira pistas: se muitos orangotangos desapareceram onde ainda há floresta, a perda de floresta não explica tudo.",
  "Literacia: ler dados e evitar relações causais demasiado simples (como o \"quanto mais… mais…\" da frase das vacinas). O estudo aponta abate de árvores, plantações de palmeira, minas, agricultura industrial e também a morte direta de animais (caça, conflito), que ajuda a explicar por que razão tantos orangotangos desapareceram em zonas que continuaram com floresta. Distinção útil no secundário: <b>número</b> de animais que desapareceram vs. <b>densidade</b> da população.");
  check(node, 5, () => {
    S.answers.cadeia = $("#cadeia", node).value.trim();
    const v = (node.querySelector("input[name=o5]:checked") || {}).value;
    if (!v) return [false, "Escolham uma conclusão."];
    if (v !== "b") return [false, "Essa conclusão vai além do que os dados mostram. Leiam de novo as três pistas."];
    return [true, "Boa leitura dos dados! A realidade é mais complexa do que uma única causa."];
  });
  return node;
});

/* Sala 6 — avaliar uma afirmação */
ROOMS.push(() => {
  const node = roomShell(6, "E se deixarmos de comprar?", "Numa rede social, alguém publicou isto:", `
    <div class="mission" style="font-weight:600;font-style:italic">"Se todos deixarmos de comprar produtos com óleo de palma, os orangotangos ficam salvos!"</div>
    <p style="margin-top:16px"><b>Como avaliam esta afirmação?</b></p>
    <div class="opts">
      ${[["a","Verdadeira: basta deixar de comprar óleo de palma."],
         ["b","Simplificada: as escolhas dos consumidores contam, mas a palmeira-dendém produz mais óleo por hectare do que outras culturas, por isso substituí-la pode exigir ainda mais terra. E há outras causas, como a caça. Não existe uma solução única."],
         ["c","Falsa: o que compramos não tem qualquer efeito na floresta."]]
        .map(o => `<label class="opt"><input type="radio" name="o6" value="${o[0]}"><span>${o[1]}</span></label>`).join("")}
    </div>
    <div class="extra">
      <label for="acao">Que ação concreta poderia a vossa turma ou escola propor? Justifiquem.</label>
      <textarea id="acao" style="min-height:80px">${S.answers.acao || ""}</textarea>
    </div>
  `, "Uma afirmação pode ter uma parte verdadeira e mesmo assim ser simplificada. Pensem no que aconteceria se o óleo de palma fosse substituído por outro óleo que precisa de mais terreno.",
  "Literacia e avaliação crítica: distinguir falso, verdadeiro e <b>simplificado</b>. Ações possíveis a discutir: ler rótulos, preferir produtos com certificação de produção sustentável (e discutir os seus limites), reduzir o consumo de ultraprocessados, apoiar a proteção de florestas. Pergunta para o plenário: <b>\"Que entidades, que mecanismo e que evidência sustentam a afirmação?\"</b> Voltar ao título da notícia inicial, \"Os teus doces de Halloween podem estar a matar orangotangos\": é falso, simplificado ou sensacionalista? O que ganha e o que perde o leitor com um título assim?");
  check(node, 6, () => {
    S.answers.acao = $("#acao", node).value.trim();
    const v = (node.querySelector("input[name=o6]:checked") || {}).value;
    if (!v) return [false, "Escolham uma avaliação."];
    if (v !== "b") return [false, "Pensem outra vez: a afirmação tem uma parte verdadeira, mas será tudo assim tão simples?"];
    if (S.answers.acao.split(/\s+/).filter(Boolean).length < 6) return [false, "Avaliação certa! Falta propor uma ação e justificá-la."];
    return [true, "Avaliação certeira!"];
  });
  return node;
});

/* Cadeado final + conclusão */
const BANK = ["óleo de palma", "procura", "desflorestação", "habitat", "população", "monocultura", "caça", "espécie"];
function finalLock(){
  const node = el(`<section><div class="card">
    <div class="kicker">Cadeado final</div>
    <h2>Abram o cadeado</h2>
    <p>Escrevam as seis letras que descobriram, pela ordem das salas.</p>
    <div class="row"><input type="text" id="code" maxlength="6" style="max-width:220px;text-transform:uppercase;font-size:24px;letter-spacing:.3em;font-weight:800" aria-label="Código final"><button class="btn" id="open">Abrir</button></div>
    <div class="feedback" id="fb"></div>
  </div></section>`);
  $("#open", node).onclick = () => {
    if (norm($("#code", node).value) === norm(PALAVRA_FINAL)) { S.step = 8; save(); render(); }
    else feedback($("#fb", node), false, "O cadeado não abriu. Confirmem as letras no topo do ecrã.");
  };
  return node;
}
function conclusion(){
  const node = el(`<section><div class="card">
    <div class="kicker">Cadeado aberto · Bornéu</div>
    <h2>Respondam à pergunta da missão</h2>
    <div class="mission">De que forma a compra de doces pode afetar as populações de orangotangos no seu habitat natural?</div>
    <p style="margin-top:14px"><b>A vossa hipótese no início era:</b></p>
    <blockquote class="muted" style="margin:0 0 12px;border-left:4px solid var(--line);padding-left:12px">${escapeHtml(S.answers.hipotese || "—")}</blockquote>
    <label for="final">Escrevam agora a vossa explicação, usando pelo menos <b>quatro</b> destas palavras:</label>
    <div class="bank" id="bank">${BANK.map(w => `<span>${w}</span>`).join("")}</div>
    <textarea id="final" style="min-height:140px">${S.answers.final || ""}</textarea>
    <label for="mudou">O que mudou entre a vossa hipótese e esta explicação?</label>
    <textarea id="mudou" style="min-height:80px">${S.answers.mudou || ""}</textarea>
    <div class="row" style="margin-top:14px"><button class="btn" id="done">Concluir a missão</button></div>
    <div class="feedback" id="fb"></div>
    ${teacherBox("Ponte para a aula teórica", "Comparar a hipótese inicial com a explicação final: que <b>entidades</b> apareceram (óleo de palma, habitat, população)? Que <b>relações</b> (procura → desflorestação → perda de habitat)? A resposta deixou de ser \"os doces fazem mal aos orangotangos\" para ser uma cadeia de causas, com mais do que uma causa.")}
  </div></section>`);
  const ta = $("#final", node);
  const upd = () => { const t = norm(ta.value); node.querySelectorAll("#bank span").forEach(s => s.classList.toggle("used", t.includes(norm(s.textContent)))); };
  ta.oninput = upd; upd();
  $("#done", node).onclick = () => {
    S.answers.final = ta.value.trim(); S.answers.mudou = $("#mudou", node).value.trim(); save();
    const used = BANK.filter(w => norm(S.answers.final).includes(norm(w))).length;
    if (used < 4) return feedback($("#fb", node), false, `Usaram ${used} palavra(s) do banco. Precisam de pelo menos quatro.`);
    if (!S.answers.mudou) return feedback($("#fb", node), false, "Falta dizer o que mudou nas vossas ideias.");
    S.end = S.end || Date.now(); S.step = 9; save(); render();
  };
  return node;
}
function certificate(){
  const mins = S.start ? Math.round(((S.end || Date.now()) - S.start) / 60000) : 0;
  const node = el(`<section><div class="card cert">
    <div class="kicker">Missão cumprida</div>
    <h1>Parabéns, ${escapeHtml(S.team)}!</h1>
    <p>Resolveram as seis salas em <b>${mins} minutos</b>, com <b>${S.hints}</b> pista(s).</p>
    <p class="muted">Palavra-chave: ${PALAVRA_FINAL.split("").map(c => `<span class="letter">${c}</span>`).join("")}</p>
  </div>
  <div class="card">
    <div class="kicker">Página 14</div>
    <h2>A notícia completa</h2>
    <p>Agora que resolveram a missão, leiam o resto da notícia e comparem-na com a vossa explicação.</p>
    <figure style="margin:0 0 14px">${NOTICIA_COMPLETA_SVG}<figcaption class="muted" style="font-size:13px;margin-top:6px"><a href="noticia-completa.svg" target="_blank" rel="noopener">Ver em tamanho grande</a> · <a href="https://www.huffpost.com/entry/halloween-candy-orangutans-sustainable_n_5805cc1ee4b0b994d4c12ad5" target="_blank" rel="noopener">Ler o artigo original (em inglês)</a></figcaption></figure>
    <label for="comp">O que a notícia explica que vocês também descobriram? E o que fica de fora? (Lembrem-se da sala 5.)</label>
    <textarea id="comp" style="min-height:90px">${escapeHtml(S.answers.comparacao || "")}</textarea>
    ${teacherBox("Comparar com a notícia", "A notícia liga os doces ao óleo de palma e à desflorestação, mas não refere a caça nem o conflito com pessoas, que o estudo de 2018 (sala 5) mostrou ser uma causa importante. Pergunta para o plenário: <b>\"O título diz 'podem estar a matar'. Depois de investigarem, concordam? O que mudariam no título?\"</b>")}
    <div class="row noprint" style="justify-content:center;margin-top:16px">
      <button class="btn" id="dl">Descarregar as nossas respostas</button>
      <button class="btn ghost" id="pr">Imprimir</button>
    </div>
  </div></section>`);
  $("#comp", node).oninput = e => { S.answers.comparacao = e.target.value; save(); };
  $("#dl", node).onclick = download;
  $("#pr", node).onclick = () => window.print();
  return node;
}

/* ---------- peças comuns ---------- */
function teacherBox(title, html){ return `<div class="teacher ${TEACHER ? "on" : ""}"><b>Professor · ${title}</b><br>${html}</div>`; }
function roomShell(n, title, intro, body, hint, teacher){
  return el(`<section><div class="card">
    <div class="kicker">Sala ${n} de 6</div>
    <h2>${title}</h2>
    <p>${intro}</p>
    ${body}
    <div class="row" style="margin-top:18px">
      <button class="btn" data-check>Verificar</button>
      <button class="btn ghost small" data-hint type="button">Pedir uma pista</button>
      ${TEACHER ? `<button class="btn ghost small" data-skip type="button">Saltar (professor)</button>` : ""}
    </div>
    <div class="hint">💡 ${hint}</div>
    <div class="feedback"></div>
    <div class="reveal hidden" style="margin-top:16px">
      <p>Descobriram a letra <span class="letter">${PALAVRA_FINAL[n - 1]}</span></p>
      <button class="btn" data-next>${n < 6 ? "Seguir para a sala " + (n + 1) + " →" : "Ir para o cadeado final →"}</button>
    </div>
    ${teacherBox("Ponte para a teoria", teacher)}
  </div></section>`);
}
function check(node, n, fn){
  const fb = $(".feedback", node), rv = $(".reveal", node);
  const win = () => { S.letters[n - 1] = PALAVRA_FINAL[n - 1]; save(); renderLocks(); rv.classList.remove("hidden"); $("[data-check]", node).disabled = true; };
  $("[data-check]", node).onclick = () => { const [ok, msg] = fn(); save(); feedback(fb, ok, msg); if (ok) win(); };
  $("[data-hint]", node).onclick = e => { const h = $(".hint", node); if (!h.classList.contains("show")) { h.classList.add("show"); S.hints++; save(); } e.target.disabled = true; };
  const skip = $("[data-skip]", node); if (skip) skip.onclick = win;
  $("[data-next]", node).onclick = () => { S.step = n + 1; save(); render(); scrollTo(0, 0); };
  if (S.letters[n - 1]) { rv.classList.remove("hidden"); feedback(fb, true, "Sala já resolvida."); }
}
function escapeHtml(s){ return (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function download(){
  const a = S.answers, L = [];
  L.push("MISSÃO ORANGOTANGO — respostas da equipa: " + S.team, "Data: " + new Date().toLocaleString("pt-PT"), "Pistas usadas: " + S.hints, "");
  L.push("SALA 1 · Hipótese inicial: " + (a.hipotese || ""), "Confiança (1–5): " + (a.confianca || ""), "Pergunta da equipa: " + (a.pergunta || ""), "");
  L.push("SALA 2 · 'População' no quotidiano e em ciência: " + (a.populacao || ""), "");
  L.push("SALA 3 · Porque é que o óleo de palma é tão usado: " + (a.porque || ""), "");
  L.push("SALA 5 · O que acrescentariam à cadeia: " + (a.cadeia || ""), "");
  L.push("SALA 6 · Ação proposta: " + (a.acao || ""), "");
  L.push("CONCLUSÃO · Explicação final: " + (a.final || ""), "O que mudou: " + (a.mudou || ""), "", "NOTÍCIA COMPLETA · Comparação: " + (a.comparacao || ""));
  const blob = new Blob([L.join("\n")], { type: "text/plain;charset=utf-8" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "missao-orangotango-" + (S.team || "equipa").replace(/\W+/g, "-").toLowerCase() + ".txt";
  link.click();
}
$("#resetLink").onclick = e => { e.preventDefault(); if (confirm("Recomeçar a missão? As respostas desta equipa serão apagadas.")) { try { localStorage.removeItem(KEY); } catch (err) {} location.reload(); } };

/* ---------- render ---------- */
function render(){
  renderLocks();
  const app = $("#app"); app.innerHTML = "";
  if (S.step === 0) app.appendChild(intro());
  else if (S.step >= 1 && S.step <= 6) app.appendChild(ROOMS[S.step - 1]());
  else if (S.step === 7) app.appendChild(finalLock());
  else if (S.step === 8) app.appendChild(conclusion());
  else app.appendChild(certificate());
}
render();
</script>
</body>
</html>
